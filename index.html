<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стекла и Свет</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0a0a0f;
  font-family:'Segoe UI',Roboto,sans-serif;
  overflow:hidden;
  color:#fff;
}
.screen{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:radial-gradient(circle at 50% 30%,#1a1a2e 0%,#0a0a0f 100%);
}
.start-screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:1000;
  background:#0a0a0f;
  transition:opacity .8s ease;
}
.start-screen.hidden{opacity:0;pointer-events:none}
.start-title{
  font-size:2rem;
  font-weight:300;
  letter-spacing:5px;
  color:#f0d9ff;
  margin-bottom:15px;
  text-align:center;
}
.start-subtitle{
  font-size:.9rem;
  color:#777;
  letter-spacing:3px;
  margin-bottom:40px;
}
.start-btn{
  padding:15px 50px;
  font-size:1.1rem;
  letter-spacing:3px;
  color:#fff;
  background:transparent;
  border:1px solid #f0d9ff;
  border-radius:50px;
  cursor:pointer;
  transition:all .3s;
  text-transform:uppercase;
  position:relative;
  z-index:1001;
}
.start-btn:hover,.start-btn:active{
  background:#f0d9ff;
  color:#0a0a0f;
  box-shadow:0 0 35px rgba(240,217,255,.6);
}
.scene{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1.2s ease;
  pointer-events:none;
  display:none;
}
.scene.active{opacity:1;pointer-events:auto;display:block}
.figure{
  position:absolute;
  width:40px;
  height:80px;
  border-radius:20px 20px 5px 5px;
  transition:all 2s ease;
  z-index:10;
}
.figure .name{
  position:absolute;
  bottom:-25px;
  font-size:.7rem;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
  opacity:.9;
  left:50%;
  transform:translateX(-50%);
}
.figure .head{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:28px;
  border-radius:50%;
}
.artem{background:linear-gradient(180deg,#1e3a5f 0%,#0f1f33 100%)}
.artem .head{background:#2c4f7c}
.artem .name{color:#7ab8e8}
.veronika{background:linear-gradient(180deg,#5c4b51 0%,#3d3237 100%)}
.veronika .head{background:#6b5a60}
.veronika .name{color:#b8a9b0}
.veronika.rich{background:linear-gradient(180deg,#f0d9ff 0%,#c9a0dc 100%)}
.veronika.rich .head{background:#faf0ff}
.veronika.rich .name{color:#f0d9ff}
.child{
  position:absolute;
  width:20px;
  height:40px;
  border-radius:10px 10px 3px 3px;
  z-index:11;
  transition:all 2s ease;
}
.child .head{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:14px;
  border-radius:50%;
}
.child.boy{background:#4a90d9}
.child.boy .head{background:#6aade0}
.child.girl{background:#d97ab5}
.child.girl .head{background:#e89ac9}
.subtitle-container{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  max-width:800px;
  min-height:100px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-start;
  gap:10px;
  z-index:100;
  pointer-events:none;
}
.subtitle-word{
  display:inline-block;
  font-size:1.5rem;
  font-weight:700;
  color:#f0e6ff;
  text-shadow:0 0 15px rgba(240,217,255,.7);
  opacity:0;
  transform:translateY(-15px);
  animation:wordIn .7s ease forwards;
}
@keyframes wordIn{to{opacity:1;transform:translateY(0)}}
.skip-btn{
  position:absolute;
  top:20px;
  right:20px;
  padding:8px 15px;
  background:transparent;
  border:1px solid #444;
  color:#777;
  border-radius:20px;
  cursor:pointer;
  font-size:.8rem;
  z-index:200;
  display:none;
}
.skip-btn.visible{display:block}
.skip-btn:hover{color:#f0d9ff;border-color:#f0d9ff}
.voice-status{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  font-size:.7rem;
  color:#555;
  letter-spacing:1px;
  z-index:100;
  text-align:center;
  width:90%;
}
@media(max-width:600px){
  .subtitle-word{font-size:1.05rem}
  .figure{width:30px;height:60px}
  .figure .head{width:22px;height:22px;top:-16px}
}
</style>
</head>
<body>
<div class="screen">
  <div class="start-screen" id="startScreen">
    <div class="start-title">СТЕКЛА И СВЕТ</div>
    <div class="start-subtitle">история Артема и Вероники</div>
    <button class="start-btn" id="startBtn">Начать просмотр</button>
  </div>

  <button class="skip-btn" id="skipBtn">Пропустить →</button>
  <div class="subtitle-container" id="subtitleBox"></div>
  <div class="voice-status" id="voiceStatus">🔊 озвучка включена</div>

  <!-- Сцены -->
  <div class="scene" id="scene1" style="background:radial-gradient(circle at 30% 40%,#1a2a3e 0%,#0a0a14 100%)">
    <div class="figure artem" id="artem1" style="left:30%;bottom:20%"><div class="head"></div><div class="name">Артем</div></div>
  </div>
  <div class="scene" id="scene2" style="background:radial-gradient(circle at 70% 60%,#1f1a1e 0%,#08080a 100%)">
    <div class="figure veronika" id="veronika2" style="left:60%;bottom:22%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene3" style="background:radial-gradient(circle at 50% 50%,#1a2a3e 0%,#0a0a14 100%)">
    <div class="figure veronika" id="veronika3" style="left:70%;bottom:25%"><div class="head"></div><div class="name">Вероника</div></div>
    <div class="figure artem" id="artem3" style="left:25%;bottom:25%"><div class="head"></div><div class="name">Артем</div></div>
  </div>
  <div class="scene" id="scene4" style="background:radial-gradient(circle at 40% 40%,#2a1a2e 0%,#0f0a14 100%)">
    <div class="figure artem" id="artem4" style="left:38%;bottom:28%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika" id="veronika4" style="left:55%;bottom:28%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene5" style="background:radial-gradient(circle at 50% 30%,#1a1a2e 0%,#0a0a0f 100%)">
    <div class="figure artem" id="artem5" style="left:30%;bottom:30%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika" id="veronika5" style="left:60%;bottom:30%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene6" style="background:radial-gradient(circle at 50% 20%,#0f0a1a 0%,#030305 100%)">
    <div class="figure artem" id="artem6" style="left:30%;bottom:30%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika" id="veronika6" style="left:60%;bottom:30%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene7" style="background:radial-gradient(circle at 50% 40%,#3e2a4e 0%,#1a0f2e 100%)">
    <div class="figure artem" id="artem7" style="left:42%;bottom:30%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika rich" id="veronika7" style="left:52%;bottom:30%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene8" style="background:radial-gradient(circle at 50% 20%,#1a0f2e 0%,#050305 100%)">
    <div class="figure artem" id="artem8" style="left:32%;bottom:30%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika rich" id="veronika8" style="left:56%;bottom:30%"><div class="head"></div><div class="name">Вероника</div></div>
  </div>
  <div class="scene" id="scene9" style="background:radial-gradient(circle at 50% 40%,#2e1a3e 0%,#0f0518 100%)">
    <div class="figure artem" id="artem9" style="left:28%;bottom:30%"><div class="head"></div><div class="name">Артем</div></div>
    <div class="figure veronika rich" id="veronika9" style="left:60%;bottom:30%"><div class="head"></div><div class="name">Вероника</div></div>
    <div class="child boy" id="child1" style="left:36%;bottom:18%"><div class="head"></div></div>
    <div class="child girl" id="child2" style="left:48%;bottom:18%"><div class="head"></div></div>
  </div>
</div>

<script>
(function() {
  // Ждём загрузки DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  function init() {
    var startScreen = document.getElementById('startScreen');
    var startBtn = document.getElementById('startBtn');
    var skipBtn = document.getElementById('skipBtn');
    var subtitleBox = document.getElementById('subtitleBox');
    var voiceStatus = document.getElementById('voiceStatus');

    if (!startBtn) {
      console.error('Кнопка не найдена');
      return;
    }

    var started = false;
    var synth = window.speechSynthesis;
    var maleVoice = null;
    var fallbackVoice = null;

    // Поиск мужского русского голоса
    function pickVoices() {
      if (!synth) return;
      var voices = synth.getVoices();
      maleVoice = null;
      fallbackVoice = null;
      var maleKeys = ['yuri', 'pavel', 'dmitry', 'male', 'муж', 'иван', 'александр', 'максим'];

      for (var i = 0; i < voices.length; i++) {
        var v = voices[i];
        if (!v.lang || v.lang.toLowerCase().indexOf('ru') !== 0) continue;
        if (!fallbackVoice) fallbackVoice = v;
        var n = v.name.toLowerCase();
        for (var k = 0; k < maleKeys.length; k++) {
          if (n.indexOf(maleKeys[k]) !== -1) {
            maleVoice = v;
            break;
          }
        }
        if (maleVoice) break;
      }

      if (maleVoice) {
        voiceStatus.textContent = '🔊 мужской голос: ' + maleVoice.name;
        voiceStatus.style.color = '#8ec5fc';
      } else if (fallbackVoice) {
        voiceStatus.textContent = '🔊 голос: ' + fallbackVoice.name + ' (мужской не найден)';
        voiceStatus.style.color = '#d4a0ff';
      } else {
        voiceStatus.textContent = '⚠ русский голос не найден';
        voiceStatus.style.color = '#ff6b6b';
      }
    }

    if (synth) {
      pickVoices();
      if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = pickVoices;
      }
    }

    // Озвучка
    function speak(text) {
      if (!synth) return;
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ru-RU';
      u.rate = 0.85;
      u.pitch = 0.85;
      u.volume = 1;
      var chosen = maleVoice || fallbackVoice;
      if (chosen) u.voice = chosen;
      synth.speak(u);
    }

    // Простая последовательная очередь
    var queue = [];
    var running = false;

    function enqueue(fn) {
      queue.push(fn);
      if (!running) runQueue();
    }

    function runQueue() {
      if (queue.length === 0) { running = false; return; }
      running = true;
      var fn = queue.shift();
      fn();
    }

    function wait(ms, callback) {
      setTimeout(callback, ms);
    }

    // Показ слов + озвучка
    function showWords(text, wordDelay, holdDelay, next) {
      subtitleBox.innerHTML = '';
      speak(text);
      var words = text.split(' ');
      var i = 0;
      function nextWord() {
        if (i >= words.length) {
          wait(holdDelay, next);
          return;
        }
        var span = document.createElement('span');
        span.className = 'subtitle-word';
        span.textContent = words[i];
        subtitleBox.appendChild(span);
        i++;
        wait(wordDelay, nextWord);
      }
      nextWord();
    }

    // Показ сцены
    function showScene(num) {
      var scenes = document.querySelectorAll('.scene');
      for (var i = 0; i < scenes.length; i++) scenes[i].classList.remove('active');
      var s = document.getElementById('scene' + num);
      if (s) s.classList.add('active');
    }

    // Функция пропуска
    function skipAll() {
      queue = [];
      running = false;
      if (synth) synth.cancel();
      showScene(9);
      subtitleBox.innerHTML = '';
      var text = 'Мальчик и девочка. Артем и Вероника счастливы. Конец.';
      speak(text);
      var words = text.split(' ');
      for (var j = 0; j < words.length; j++) {
        (function(idx) {
          var span = document.createElement('span');
          span.className = 'subtitle-word';
          span.textContent = words[idx];
          span.style.animationDelay = (idx * 0.2) + 's';
          subtitleBox.appendChild(span);
        })(j);
      }
      skipBtn.style.display = 'none';
    }

    // === СЦЕНАРИЙ ===
    function runStory() {
      var steps = [
        { scene: 1, lines: [
          ['Артем. Стеклянные небоскребы. Ночные огни.', 450, 1500],
          ['Он привык, что все двери открываются сами.', 450, 1500]
        ]},
        { scene: 2, lines: [
          ['Вероника. Далекий город. Серые стены.', 450, 1500],
          ['Она считала копейки. И мечтала о другом.', 450, 1500]
        ]},
        { scene: 3, lines: [
          ['Однажды работа позвала ее в город Артема.', 450, 1500],
          ['Она вышла на перрон. С одним чемоданом.', 450, 1500]
        ]},
        { scene: 4, lines: [
          ['В тот день они столкнулись в кофейне.', 450, 1500],
          ['Артем заметил ее уставший, но живой взгляд.', 450, 1500]
        ]},
        { scene: 5, lines: [
          ['Он предложил ей работу в своем доме.', 450, 1500],
          ['Горничная. Она согласилась.', 450, 1500]
        ]},
        { scene: 6, lines: [
          ['Проходили недели. Между ними росло напряжение.', 450, 1500],
          ['Однажды ночью они не смогли сдержаться.', 450, 1800]
        ]},
        { scene: 7, lines: [
          ['Утром он понял: это не просто работа.', 450, 1500],
          ['Они поженились. Вероника стала частью его мира.', 450, 1800]
        ]},
        { scene: 8, lines: [
          ['Ночь после свадьбы. Их первая ночь как мужа и жены.', 450, 1500],
          ['Они были вместе. По-настоящему.', 450, 1800]
        ]},
        { scene: 9, lines: [
          ['Через год она родила двойню.', 450, 1500],
          ['Мальчик и девочка. Артем и Вероника счастливы.', 450, 1800],
          ['Конец.', 550, 2500]
        ]}
      ];

      var currentStep = 0;
      var currentLine = 0;

      function nextAction() {
        if (currentStep >= steps.length) {
          skipBtn.style.display = 'none';
          return;
        }
        var step = steps[currentStep];
        if (currentLine === 0) {
          showScene(step.scene);
          wait(600, processLine);
        } else {
          processLine();
        }
      }

      function processLine() {
        var step = steps[currentStep];
        if (!step || currentLine >= step.lines.length) {
          currentStep++;
          currentLine = 0;
          nextAction();
          return;
        }
        var line = step.lines[currentLine];
        currentLine++;
        showWords(line[0], line[1], line[2], function() {
          // Небольшая пауза между фразами
          wait(300, processLine);
        });
      }

      nextAction();
    }

    // Старт по кнопке
    startBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (started) return;
      started = true;
      startScreen.classList.add('hidden');
      skipBtn.style.display = 'block';
      
      if (synth) {
        var unlock = new SpeechSynthesisUtterance('');
        unlock.volume = 0;
        synth.speak(unlock);
      }
      
      runStory();
    });

    skipBtn.addEventListener('click', function(e) {
      e.preventDefault();
      skipAll();
    });
  }
})();
</script>
</body>
                                                                              </html>
